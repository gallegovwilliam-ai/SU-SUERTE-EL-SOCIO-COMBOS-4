<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Su Suerte El Socio - Mega Combo Bolivia</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">

    <!-- BANNER UNIFICADO (SÓLO LA IMAGEN COMPLETA) -->
    <header class="container-fluid px-0 mb-4 text-center">
        <img src="banner-bolivia.jpg" alt="Su Suerte El Socio" class="img-fluid w-100 banner-img shadow-lg">
    </header>

    <!-- PANEL PRINCIPAL (GRILLA + FORMULARIO) -->
    <main class="container my-2">
        <div class="row g-4">
            
            <!-- SECCIÓN IZQUIERDA: MATRIZ DE NÚMEROS -->
            <div class="col-lg-8">
                <div class="card bg-dark border-secondary text-white p-3 shadow-lg rounded-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="m-0 text-warning"><i class="fa-solid fa-bullseye"></i> Elige tus números para participar</h4>
                        <button onclick="agregarCombo()" class="btn btn-warning btn-sm fw-bold px-3 text-dark rounded-pill">
                            <i class="fa-solid fa-dice me-1"></i> Generar Combo (4 Números)
                        </button>
                    </div>

                    <!-- LEYENDA ESTADOS -->
                    <div class="d-flex gap-3 mb-3 small align-items-center">
                        <span class="d-flex align-items-center gap-1"><i class="fa-solid fa-circle text-success"></i> Disponible</span>
                        <span class="d-flex align-items-center gap-1"><i class="fa-solid fa-circle text-warning"></i> Seleccionado</span>
                        <span class="d-flex align-items-center gap-1"><i class="fa-solid fa-circle text-danger"></i> Ocupado</span>
                    </div>

                    <!-- GRILLA DE NÚMEROS -->
                    <div id="gridContainer" class="d-flex flex-wrap justify-content-center gap-2 py-2">
                        <!-- Carga vía app.js -->
                    </div>
                </div>
            </div>

            <!-- SECCIÓN DERECHA: FORMULARIO Y RESUMEN -->
            <div class="col-lg-4">
                <div class="card bg-dark border-secondary text-white p-3 shadow-lg rounded-4">
                    <h5 class="text-warning mb-1"><i class="fa-solid fa-user-pen"></i> Completa tus datos</h5>
                    <p class="small text-secondary mb-3">Revisa que tus datos sean correctos para continuar.</p>

                    <div class="mb-2">
                        <label class="form-label small text-secondary">Nombre completo</label>
                        <input type="text" id="txtNombre" class="form-control bg-black text-white border-secondary" placeholder="Ej. Juan Pérez">
                    </div>

                    <div class="mb-2">
                        <label class="form-label small text-secondary">Ciudad</label>
                        <input type="text" id="txtCiudad" class="form-control bg-black text-white border-secondary" placeholder="Ej. La Paz">
                    </div>

                    <div class="mb-2">
                        <label class="form-label small text-secondary">Teléfono / WhatsApp</label>
                        <input type="tel" id="txtTelefono" class="form-control bg-black text-white border-secondary" placeholder="Ej. 71234567">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-secondary">Método de pago</label>
                        <select id="selectPago" class="form-select bg-black text-white border-secondary">
                            <option value="Banco Ganadero (QR)">Banco Ganadero (QR)</option>
                            <option value="Tigo Money">Tigo Money</option>
                            <option value="Efectivo / Transferencia">Efectivo / Transferencia</option>
                        </select>
                    </div>

                    <!-- RESUMEN DE SELECCIONADOS -->
                    <div class="p-2 border border-secondary rounded-3 bg-black mb-3">
                        <div class="d-flex justify-content-between small text-secondary mb-2">
                            <span>Resumen de selección:</span>
                            <span id="countSeleccionados" class="badge bg-warning text-dark">0 Números</span>
                        </div>
                        <div id="listaSeleccionadosBadges" class="d-flex flex-wrap gap-1">
                            <span class="small text-secondary">Ningún combo seleccionado</span>
                        </div>
                    </div>

                    <!-- BOTÓN WHATSAPP -->
                    <button id="btnEnviarWhatsApp" onclick="enviarYGuardarEnGoogleSheets()" class="btn btn-warning w-100 fw-bold py-2 text-dark rounded-3">
                        <i class="fa-brands fa-whatsapp fs-5 me-1"></i> Confirmar participación por WhatsApp →
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
